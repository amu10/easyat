spring:
  application:
    name: inventory-service
  datasource:
    url: jdbc:mysql://localhost:3306/easyat01?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: root
  sql:
    init:
      mode: always
      encoding: UTF-8
  cloud:
    nacos:
      # 顶层 server-addr/username/password 供 Nacos 公共上下文使用
      server-addr: 192.168.110.237:8848
      username: nacos
      password: gg123456
      discovery:
        # 关键：NacosDiscoveryProperties 只认 spring.cloud.nacos.discovery.server-addr
#        server-addr: 192.168.110.237:8848
#        username: nacos
#        password: gg123456
        enabled: true
        ip: 127.0.0.1

server:
  port: 18182

easy-at:
  application-name: inventory-service
  production: false
  storage:
    type: jdbc
  lock:
    type: jdbc
    wait-timeout: 1s
    lease: 30s
  recovery:
    enabled: true
    interval: 5s
    batch-size: 20
    max-retries: 3
  cleanup:
    enabled: false
    interval: 1m
    batch-size: 100
    committed-retention: 7d
    rolled-back-retention: 30d
    expired-lock-retention: 10m

logging:
  level:
    io.github.easyat: INFO
