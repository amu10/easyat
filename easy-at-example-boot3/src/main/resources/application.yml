spring:
  application:
    name: easy-at-example
  datasource:
    url: jdbc:mysql://localhost:3306/easyat01?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: root
  sql:
    init:
      mode: always
      encoding: UTF-8

server:
  port: 18080

easy-at:
  application-name: easy-at-example
  production: false
  storage:
    type: jdbc
  lock:
    type: jdbc
    wait-timeout: 1s
    lease: 30s
  recovery:
    enabled: true
    interval: 5s
    batch-size: 20
    max-retries: 3
