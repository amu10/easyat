spring:
  application:
    name: easy-at-example
  datasource:
    url: jdbc:mysql://localhost:3306/easyat01?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: root
  sql:
    init:
      mode: always
      encoding: UTF-8

server:
  port: 18080

easy-at:
  application-name: easy-at-example
  production: false
  storage:
    type: jdbc
  lock:
    type: jdbc
    wait-timeout: 1s
    lease: 30s
  recovery:
    enabled: true
    interval: 5s
    batch-size: 20
    max-retries: 3
  cleanup:
    # 示例默认不删除历史，便于通过 /demo/transactions 和 /demo/undo-logs 观察。
    enabled: false
    interval: 1m
    batch-size: 100
    committed-retention: 7d
    rolled-back-retention: 30d
    expired-lock-retention: 10m
